name: Build desktop packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - id: config
        run: |
          node scripts/release-version.mjs check
          echo "matrix=$(node scripts/release-config.mjs matrix)" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run build

  desktop:
    name: ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils xvfb dbus-x11
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.id }}
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build installers
        run: npm run desktop:build -- --ci --target "${{ matrix.target }}" -- --locked
      - name: Windows WebView2 regression
        if: runner.os == 'Windows'
        run: npm run test:native
        env:
          JSONL_QA_EXE: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/JSONL Viewer.exe
          JSONL_QA_ARTIFACT_DIR: ${{ runner.temp }}/jsonl-native-artifacts
      - name: Linux desktop launch
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node tests/desktop-smoke.mjs "src-tauri/target/${{ matrix.target }}/release/jsonl-viewer"
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: macOS desktop launch
        if: runner.os == 'macOS'
        run: node tests/desktop-smoke.mjs "src-tauri/target/${{ matrix.target }}/release/bundle/macos/JSONL Viewer.app/Contents/MacOS/JSONL Viewer"
      - name: Collect platform installers
        run: node scripts/release-assets.mjs package "${{ matrix.id }}" release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload Windows test evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests-${{ matrix.id }}
          path: ${{ runner.temp }}/jsonl-native-artifacts
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: [quality, desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset set and generate checksums
        run: node scripts/release-assets.mjs collect release-assets
      - name: Generate release notes preview
        run: node scripts/generate-release-notes.mjs "v$(node scripts/release-version.mjs check)" release-notes.md --preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: |
            release-assets/*
            release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
