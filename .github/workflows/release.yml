name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check release version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/release-version.mjs check "$GITHUB_REF_NAME"
          else
            node scripts/release-version.mjs check
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs "$GITHUB_REF_NAME" release-notes.md
      - name: Upload, verify and publish release
        run: node scripts/publish-release.mjs "$GITHUB_REF_NAME" release-assets release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
